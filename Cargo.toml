# soksak-sidecar-terminal-vt100 — terminal-domain sidecar (vt100 VT engine).
# An engine unit for the contract soksak-spec-sidecar-terminal (canonical text in
# the soksak-contract-terminal repo's SPEC.md). The core does not link this
# crate: it consumes the daemon's documented wire (soksak-pty-proto framing,
# reimplemented here) and serves terminal plugins over a rendezvous socket. The
# engine name lives in this unit's name only; the contract is engine-neutral.
[package]
name = "soksak-sidecar-terminal-vt100"
version = "0.0.27"
edition = "2024"
publish = false
description = "Terminal-domain restore sidecar on the vt100 VT engine: mirrors PTY session output into screen state (scrollback, alt-screen, private modes), serializes it into replayable paint for warm/cold restore, and checkpoints sealed plaintext through the core PTY daemon."

[lib]
name = "soksak_sidecar_terminal_vt100"
path = "src/lib.rs"

# The survival service — subscribes to the daemon tees, checkpoints the mirrors, and
# serves restore over the identity-home rendezvous socket. resolve_sidecar_cmd stages
# dist/soksak-sidecar-terminal-vt100 (stage.sh).
[[bin]]
name = "soksak-sidecar-terminal-vt100"
path = "src/main.rs"

[dependencies]
# Restore engine — the vt100 VT model (parser + grid + scrollback + modes), the sole
# engine seat behind the engine module. vt100 never writes a reply to the PTY, so
# query suppression is inherent; swallowed queries are counted through its Callbacks
# trait (unhandled_csi/unhandled_osc/unhandled_escape). MIT, © Jesse Luehrs; the
# attribution ships in THIRD-PARTY-NOTICES.
#
# Immutable engine revision providing the DEC Special Graphics behavior required by the qualification fixture.
vt100 = { git = "https://github.com/min-median-max/vt100-rust.git", rev = "70cd8080c963a913f15a708f97b87e4b5f95c148" }
# Wire — the daemon speaks NDJSON + base64 payloads; this unit reimplements the
# documented shape (proto module) rather than linking the core crate.
serde_json = "1"
base64 = "0.22"
# Cross-platform local-socket IPC — the rendezvous socket this unit serves and the
# daemon control/stream sockets it consumes. interprocess dispatches to Unix domain
# sockets on Unix and named pipes on Windows behind one API, inserting no framing of its
# own, so the NDJSON + length-prefixed tee protocol is byte-for-byte unchanged.
interprocess = "2"
getrandom = "=0.3.4"
soksak-kit-sidecar-terminal = { git = "https://github.com/soksak-ai/soksak-kit-sidecar-terminal", rev = "a83a8333d4f72fff00bc318541013b7449661299", features = ["integration-tests"] }

# Redirect the survival service's own stderr to a home log so checkpoint failures are
# visible (the plugin spawns it over a stdio Channel that drops stderr). The redirect is
# a platform-specific syscall: dup2 on Unix, SetStdHandle on Windows.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
# The contract and its acceptance suite: the corpus, the declared reference states, and the assertions.
# It has no engine of its own — the standard is the declared screen state, not what any
# implementation does. Dev-only: nothing from it ships.
soksak-contract-terminal = { git = "https://github.com/soksak-ai/soksak-contract-terminal", rev = "e2d60b034148fdf6b43637bba41e9a068515c0a8" }

# This repository is its own Cargo workspace.
[workspace]
